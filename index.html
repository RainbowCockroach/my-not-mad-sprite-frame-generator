<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sprite Frame — my-not-mad</title>
<meta name="description" content="Generates exact-size canvases and guide wireframes for hand-drawn furniture and character sprites.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@400;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0E1930;
    --sheet:#152340;
    --rule:#2B3E67;
    --chalk:#E9EEF8;
    --muted:#7F93BE;
    --shu:#E4572E;
    --paper:#EDEFE7;
    --display:"Zen Old Mincho",Georgia,serif;
    --sans:"IBM Plex Sans",system-ui,sans-serif;
    --mono:"IBM Plex Mono",ui-monospace,monospace;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:var(--ink);color:var(--chalk);
    font-family:var(--sans);font-size:14px;line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }

  .frame{min-height:100%;display:flex;flex-direction:column}

  /* ---- masthead ---- */
  header{
    display:flex;align-items:center;gap:22px;flex-wrap:wrap;
    padding:18px 24px 0;border-bottom:1px solid var(--rule);
  }
  h1{
    font-family:var(--display);font-weight:700;font-size:26px;line-height:1;
    margin:0 0 16px;letter-spacing:.06em;
  }
  h1 .mark{color:var(--shu)}
  header .spacer{flex:1}
  header .sub{
    font-family:var(--mono);font-size:11px;letter-spacing:.14em;
    text-transform:uppercase;color:var(--muted);margin-bottom:18px;
  }

  /* ---- tabs ---- */
  .tabs{display:flex;gap:2px;align-self:flex-end}
  .tabs button{
    background:transparent;border:none;border-bottom:2px solid transparent;
    color:var(--muted);font-family:var(--mono);font-size:11.5px;letter-spacing:.16em;
    text-transform:uppercase;padding:10px 14px 12px;cursor:pointer;
    margin-bottom:-1px;transition:color .12s;
  }
  .tabs button:hover{color:var(--chalk)}
  .tabs button[aria-selected=true]{color:var(--chalk);border-bottom-color:var(--shu)}
  .tabs button:focus-visible{outline:2px solid var(--shu);outline-offset:-4px}

  main{flex:1;display:grid;grid-template-columns:340px 1fr;min-height:0}

  /* ---- spec column ---- */
  .spec{border-right:1px solid var(--rule);padding:22px 24px 40px;overflow-y:auto}
  .legend{
    font-family:var(--mono);font-size:11px;letter-spacing:.16em;
    text-transform:uppercase;color:var(--muted);
    display:flex;align-items:center;gap:10px;margin:0 0 14px;
  }
  .legend::after{content:"";flex:1;height:1px;background:var(--rule)}
  .panel .legend ~ .legend{margin-top:26px}

  .dim{
    display:grid;grid-template-columns:1fr auto;align-items:center;
    gap:12px;padding:10px 0;border-bottom:1px solid var(--rule);
  }
  .dim label{display:block}
  .dim .name{font-size:14px}
  .dim .axis{font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.08em}
  .stepper{display:flex;align-items:center;gap:4px}
  .stepper button{
    width:38px;height:40px;flex:none;
    border:1px solid var(--rule);background:transparent;color:var(--muted);
    font-family:var(--mono);font-size:17px;line-height:1;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    touch-action:manipulation;-webkit-user-select:none;user-select:none;
    transition:color .12s,border-color .12s,background .12s;
  }
  .stepper button:hover{color:var(--chalk);border-color:var(--muted)}
  .stepper button.held{background:var(--rule);color:var(--chalk);border-color:var(--muted)}
  .stepper button:disabled{opacity:.3;cursor:default;background:transparent;color:var(--muted)}

  /* the value itself is a scrub surface: drag sideways to change it */
  .field{position:relative;flex:none;line-height:0}
  .stepper input{
    width:84px;height:40px;text-align:center;background:var(--sheet);
    border:1px solid var(--rule);color:var(--chalk);
    font-family:var(--mono);font-size:16px;
    touch-action:pan-y;cursor:ew-resize;
  }
  .field::after{
    content:"";position:absolute;left:50%;bottom:6px;width:20px;height:0;
    transform:translateX(-50%);border-top:2px dotted var(--muted);
    opacity:.45;pointer-events:none;transition:opacity .12s;
  }
  .field.scrub::after{opacity:0}
  .stepper input.scrub{border-color:var(--shu);color:var(--shu);background:var(--ink);-webkit-user-select:none;user-select:none}
  .bubble{
    position:absolute;left:50%;bottom:calc(100% + 9px);transform:translateX(-50%);
    background:var(--shu);color:#fff;font-family:var(--mono);font-size:12.5px;
    letter-spacing:.04em;line-height:1.3;padding:5px 10px;white-space:nowrap;
    pointer-events:none;opacity:0;transition:opacity .1s;z-index:6;
  }
  .bubble b{font-weight:500}
  .bubble i{font-style:normal;opacity:.72;font-size:10.5px;letter-spacing:.1em}
  .bubble::after{
    content:"";position:absolute;left:50%;top:100%;margin-left:-5px;
    border:5px solid transparent;border-top-color:var(--shu);
  }
  .bubble.on{opacity:1}
  .stepper input:focus-visible,.stepper button:focus-visible,
  summary:focus-visible,.switch:focus-within{outline:2px solid var(--shu);outline-offset:2px}

  .usehint{
    font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;
    color:var(--muted);border-left:2px solid var(--shu);padding:5px 0 5px 10px;margin:0 0 18px;
  }
  input[type=number]{-moz-appearance:textfield}
  input[type=number]::-webkit-outer-spin-button,
  input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}

  details{margin-top:28px}
  summary{
    font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;
    color:var(--muted);cursor:pointer;list-style:none;
    display:flex;align-items:center;gap:10px;
  }
  summary::-webkit-details-marker{display:none}
  summary::before{content:"+";color:var(--shu);font-size:13px}
  details[open] summary::before{content:"\2212"}
  summary::after{content:"";flex:1;height:1px;background:var(--rule)}
  .dim-wide{grid-template-columns:1fr}
  .text-in{
    width:100%;height:32px;margin-top:8px;padding:0 9px;
    background:var(--sheet);border:1px solid var(--rule);color:var(--chalk);
    font-family:var(--mono);font-size:12px;
  }
  .text-in:focus-visible{outline:2px solid var(--shu);outline-offset:2px}
  .proj{padding:14px 0 4px}
  .proj .dim{border-bottom:none;padding:6px 0}

  .derived{
    font-family:var(--mono);font-size:11.5px;color:var(--muted);
    border-left:2px solid var(--rule);padding:8px 0 8px 12px;margin:18px 0 0;
  }
  .derived b{color:var(--chalk);font-weight:500}
  .derived em{color:var(--shu);font-style:normal}

  .switches{margin-top:26px;display:grid;gap:2px}
  .switch{
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:9px 0;border-bottom:1px solid var(--rule);cursor:pointer;
  }
  .switch span{font-size:13px}
  .switch input{accent-color:var(--shu);width:16px;height:16px}
  .seg{display:flex;border:1px solid var(--rule)}
  .seg button{
    padding:5px 11px;background:transparent;border:none;color:var(--muted);
    font-family:var(--mono);font-size:11px;cursor:pointer;
  }
  .seg button[aria-pressed=true]{background:var(--rule);color:var(--chalk)}

  .panel[hidden]{display:none}

  /* ---- sheet ---- */
  .sheet{
    position:relative;min-width:0;display:flex;align-items:center;justify-content:center;
    padding:40px 40px 104px;overflow:auto;
    background-color:var(--ink);
    background-image:
      repeating-linear-gradient(to right,var(--rule) 0 1px,transparent 1px 48px),
      repeating-linear-gradient(to bottom,var(--rule) 0 1px,transparent 1px 48px);
    background-position:center;
  }
  .sheet::before{
    content:"";position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(ellipse at 50% 45%,transparent 20%,var(--ink) 95%);
  }
  .stage{position:relative;z-index:1;line-height:0}
  .stage canvas{display:block;max-width:100%;height:auto}
  .stage.on-paper{background:var(--paper)}
  .stage.on-ink{background:var(--sheet)}
  .stage::after{
    content:"";position:absolute;inset:-1px;border:1px dashed var(--muted);pointer-events:none;
  }

  /* ---- title block ---- */
  .titleblock{
    position:absolute;right:24px;bottom:24px;z-index:2;
    background:var(--sheet);border:1px solid var(--rule);
    display:flex;flex-direction:column;
  }
  .tb-row{display:flex;align-items:stretch}
  .tb-cell{padding:9px 14px;border-right:1px solid var(--rule)}
  .tb-cell .k{
    font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;
    text-transform:uppercase;color:var(--muted);display:block;
  }
  .tb-cell .v{font-family:var(--mono);font-size:15px;color:var(--chalk)}
  .tb-cell .v small{font-size:11px;color:var(--muted)}
  button.export{
    border:none;background:var(--shu);color:#fff;
    font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;
    padding:0 20px;cursor:pointer;
  }
  button.export:hover{filter:brightness(1.1)}
  button.export:focus-visible{outline:2px solid var(--chalk);outline-offset:-4px}
  .copyhint{
    border-top:1px solid var(--rule);
    font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--muted);
    padding:5px 14px;text-align:right;
  }

  @media (max-width:880px){
    main{grid-template-columns:1fr}
    .dim{grid-template-columns:1fr;gap:8px;padding:12px 0}
    .dim .stepper{justify-content:flex-start}
    .stepper button{width:52px;height:48px;font-size:19px}
    .stepper input{width:110px;height:48px;font-size:18px}
    .spec{border-right:none;border-bottom:1px solid var(--rule)}
    .sheet{padding:28px 20px 140px;min-height:60vh}
    .titleblock{right:20px;left:20px;bottom:20px}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="frame">
  <header>
    <h1><span class="mark">&#9711;</span> Sprite Frame</h1>
    <div class="tabs" role="tablist">
      <button type="button" role="tab" id="tab-furniture" aria-selected="true" aria-controls="spec-furniture">Furniture</button>
      <button type="button" role="tab" id="tab-character" aria-selected="false" aria-controls="spec-character">Character</button>
    </div>
    <div class="spacer"></div>
    <div class="sub">my-not-mad &middot; guide sheets</div>
  </header>

  <main>
    <section class="spec">
      <p class="usehint">Drag a value sideways to scrub &middot; keep dragging down for finer steps &middot; tap to type &middot; hold &minus;/+ to repeat</p>

      <!-- ============ FURNITURE ============ -->
      <div class="panel" id="spec-furniture" role="tabpanel" aria-labelledby="tab-furniture">
        <p class="legend">Footprint &amp; height</p>

        <div class="dim">
          <label for="in-w"><span class="name">Width</span><br><span class="axis">along X &middot; toward camera-right</span></label>
          <div class="stepper"><input id="in-w" type="number" value="1" min="0.05" step="0.25" inputmode="decimal"></div>
        </div>

        <div class="dim">
          <label for="in-d"><span class="name">Depth</span><br><span class="axis">along Z &middot; into the screen</span></label>
          <div class="stepper"><input id="in-d" type="number" value="1" min="0.05" step="0.25" inputmode="decimal"></div>
        </div>

        <div class="dim">
          <label for="in-h"><span class="name">Height</span><br><span class="axis">along Y &middot; upright</span></label>
          <div class="stepper"><input id="in-h" type="number" value="1" min="0" step="0.25" inputmode="decimal"></div>
        </div>

        <div class="switches">
          <label class="switch"><span>1-unit grid</span><input id="in-grid" type="checkbox"></label>
          <label class="switch"><span>Hidden edges dashed</span><input id="in-hidden" type="checkbox" checked></label>
        </div>
      </div>

      <!-- ============ CHARACTER ============ -->
      <div class="panel" id="spec-character" role="tabpanel" aria-labelledby="tab-character" hidden>
        <p class="legend">Figure</p>

        <div class="dim">
          <label for="in-ch"><span class="name">Height</span><br><span class="axis">metres, floor to crown</span></label>
          <div class="stepper"><input id="in-ch" type="number" value="1.7" min="0.1" step="0.01" inputmode="decimal"></div>
        </div>

        <p class="legend">Gait</p>

        <div class="dim">
          <label for="in-walk"><span class="name">Walk speed</span><br><span class="axis">m/s &middot; 1.4 is an everyday pace</span></label>
          <div class="stepper"><input id="in-walk" type="number" value="1.4" min="0.3" step="0.1" inputmode="decimal"></div>
        </div>

        <div class="dim">
          <label for="in-run"><span class="name">Run speed</span><br><span class="axis">m/s &middot; for rows labelled "run"</span></label>
          <div class="stepper"><input id="in-run" type="number" value="3.5" min="0.5" step="0.1" inputmode="decimal"></div>
        </div>

        <div class="switches">
          <label class="switch"><span>Pose template</span><input id="in-pose" type="checkbox" checked></label>
        </div>

        <details>
          <summary>Sheet &amp; guides</summary>
          <div class="proj">
            <div class="dim">
              <label for="in-heads"><span class="name">Heads tall</span><br><span class="axis">proportion lines &middot; 0 hides them</span></label>
              <div class="stepper"><input id="in-heads" type="number" value="0" min="0" step="0.5" inputmode="decimal"></div>
            </div>
            <div class="dim">
              <label for="in-step"><span class="name">Step length</span><br><span class="axis">metres &middot; 0 works it out from height</span></label>
              <div class="stepper"><input id="in-step" type="number" value="0" min="0" step="0.05" inputmode="decimal"></div>
            </div>
            <div class="dim">
              <label for="in-margin"><span class="name">Floor margin</span><br><span class="axis">px below the feet &middot; room for the near foot</span></label>
              <div class="stepper"><input id="in-margin" type="number" value="40" min="0" step="8" inputmode="numeric"></div>
            </div>
            <div class="dim">
              <label for="in-cr"><span class="name">Stance radius</span><br><span class="axis">metres &middot; the capsule on the floor</span></label>
              <div class="stepper"><input id="in-cr" type="number" value="0.5" min="0" step="0.05" inputmode="decimal"></div>
            </div>
            <div class="dim dim-wide">
              <label for="in-labels"><span class="name">Row labels</span><br><span class="axis">one per row &middot; "back" and "right" aim the arrow</span></label>
              <input id="in-labels" type="text" class="text-in" value="Front idle, Front walk, Back idle, Back walk">
            </div>
            <div class="dim">
              <label for="in-cell"><span class="name">Cell size</span><br><span class="axis">pixels, square</span></label>
              <div class="stepper"><input id="in-cell" type="number" value="256" min="8" step="32" inputmode="numeric"></div>
            </div>
            <div class="dim">
              <label for="in-cols"><span class="name">Columns</span><br><span class="axis">frames per animation</span></label>
              <div class="stepper"><input id="in-cols" type="number" value="8" min="1" step="1" inputmode="numeric"></div>
            </div>
            <div class="dim">
              <label for="in-rows"><span class="name">Rows</span><br><span class="axis">one animation per row</span></label>
              <div class="stepper"><input id="in-rows" type="number" value="4" min="1" step="1" inputmode="numeric"></div>
            </div>
          </div>
        </details>
      </div>

      <!-- ============ SHARED ============ -->
      <div class="switches">
        <div class="switch" style="cursor:default">
          <span>Export ink</span>
          <div class="seg" id="ink-seg">
            <button type="button" data-ink="light" aria-pressed="false">Light</button>
            <button type="button" data-ink="dark" aria-pressed="true">Dark</button>
          </div>
        </div>
      </div>

      <details>
        <summary>Projection</summary>
        <div class="proj">
          <div class="dim">
            <label for="in-ppu"><span class="name">Pixels per unit</span></label>
            <div class="stepper"><input id="in-ppu" type="number" value="128" min="1" step="1" inputmode="decimal"></div>
          </div>
          <div class="dim">
            <label for="in-yaw"><span class="name">Camera yaw</span><br><span class="axis">degrees around Y</span></label>
            <div class="stepper"><input id="in-yaw" type="number" value="45" min="0" max="89" step="1" inputmode="decimal"></div>
          </div>
          <div class="dim">
            <label for="in-tilt"><span class="name">Camera tilt</span><br><span class="axis">degrees down</span></label>
            <div class="stepper"><input id="in-tilt" type="number" value="30" min="0" max="89" step="1" inputmode="decimal"></div>
          </div>
        </div>
      </details>

      <p class="derived" id="derived"></p>
    </section>

    <section class="sheet">
      <div class="stage on-ink" id="stage"><canvas id="preview"></canvas></div>

      <div class="titleblock">
        <div class="tb-row">
          <div class="tb-cell">
            <span class="k">Canvas</span>
            <span class="v" id="out-size">&mdash;</span>
          </div>
          <div class="tb-cell" id="tb-extra" hidden>
            <span class="k" id="out-extra-k">Figure</span>
            <span class="v" id="out-extra">&mdash;</span>
          </div>
          <div class="tb-cell" id="tb-clip" hidden>
            <span class="k">Walk clip</span>
            <span class="v" id="out-clip">&mdash;</span>
          </div>
          <button class="export" id="download" type="button">Download PNG</button>
        </div>
        <div class="copyhint" id="copyhint">click size to copy</div>
      </div>
    </section>
  </main>
</div>

<script>
(function(){
  "use strict";

  var $ = function(id){ return document.getElementById(id); };
  var inPPU = $("in-ppu"), inYaw = $("in-yaw"), inTilt = $("in-tilt");
  var stage = $("stage"), preview = $("preview");
  var outSize = $("out-size"), outExtra = $("out-extra"), outExtraK = $("out-extra-k");
  var tbExtra = $("tb-extra"), derived = $("derived"), copyhint = $("copyhint");

  var INK_LIGHT = "#E9EEF8", INK_DARK = "#0E1930";
  var RAD = Math.PI / 180;
  var ink = "dark";         // "light" | "dark" — dark ink on a paper sheet by default
  var tab = "furniture";    // "furniture" | "character"

  function num(el, fallback, min){
    var v = parseFloat(el.value);
    if (!isFinite(v)) v = fallback;
    if (min !== undefined && v < min) v = min;
    return v;
  }

  // Pixels a single world unit travels on screen, in the drawn canvas' own pixels.
  // CameraFacingBillboard cancels the camera's vertical squash, so drawn px == screen px.
  function metrics(){
    var ppu  = num(inPPU, 128, 1);
    var yaw  = num(inYaw, 45, 0) * RAD;
    var tilt = num(inTilt, 30, 0) * RAD;
    return {
      across: Math.cos(yaw) * ppu,                   // ground unit, horizontal
      rise:   Math.sin(tilt) * Math.sin(yaw) * ppu,  // ground unit, vertical
      up:     Math.cos(tilt) * ppu                   // height unit, vertical
    };
  }

  function line(ctx, ax, ay, bx, by){
    ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(bx, by); ctx.stroke();
  }

  /* ================= furniture ================= */

  var inW = $("in-w"), inD = $("in-d"), inH = $("in-h");
  var inGrid = $("in-grid"), inHidden = $("in-hidden");

  function furnitureSpec(){
    var L = num(inW, 1, 0.05), W = num(inD, 1, 0.05), H = num(inH, 1, 0);
    var m = metrics();
    var wpx = (L + W) * m.across;
    var hpx = (L + W) * m.rise + H * m.up;
    return {
      L:L, W:W, H:H, m:m, wpx:wpx, hpx:hpx,
      cw: Math.max(1, Math.ceil(wpx)),
      ch: Math.max(1, Math.ceil(hpx))
    };
  }

  // World (x, y, z) with origin at the footprint centre -> canvas pixel coords.
  function project(s, x, y, z){
    return {
      x: (x - z) * s.m.across + s.wpx / 2,
      y: s.hpx - ((x + z) * s.m.rise + y * s.m.up + (s.L + s.W) / 2 * s.m.rise)
    };
  }

  function edge(ctx, s, a, b){
    var p = project(s, a[0], a[1], a[2]), q = project(s, b[0], b[1], b[2]);
    line(ctx, p.x, p.y, q.x, q.y);
  }

  function paintFurniture(ctx, s, color){
    var hx = s.L / 2, hz = s.W / 2, H = s.H;
    var dash = inHidden.checked, t, i;
    ctx.lineCap = "square";
    ctx.strokeStyle = color;

    // Near corner is (-hx, -hz): the camera sits on the -X / -Z side.
    var near = [-hx, -hz], right = [hx, -hz], far = [hx, hz], left = [-hx, hz];
    var ring = [near, right, far, left];

    if (inGrid.checked){
      ctx.save();
      ctx.globalAlpha = 0.34;
      ctx.lineWidth = 1;
      for (t = 1; t < s.L - 1e-6; t++) edge(ctx, s, [-hx + t, 0, -hz], [-hx + t, 0, hz]);
      for (t = 1; t < s.W - 1e-6; t++) edge(ctx, s, [-hx, 0, -hz + t], [hx, 0, -hz + t]);
      for (t = 1; t < H - 1e-6; t++)
        for (i = 0; i < 4; i++)
          edge(ctx, s, [ring[i][0], t, ring[i][1]], [ring[(i+1)%4][0], t, ring[(i+1)%4][1]]);
      ctx.restore();
    }

    ctx.lineWidth = 1;

    // Hidden: the far corner's post and the two bottom edges behind the box.
    if (dash){
      ctx.save();
      ctx.globalAlpha = 0.5;
      ctx.setLineDash([4, 4]);
      edge(ctx, s, [far[0], 0, far[1]], [far[0], H, far[1]]);
      edge(ctx, s, [right[0], 0, right[1]], [far[0], 0, far[1]]);
      edge(ctx, s, [left[0], 0, left[1]], [far[0], 0, far[1]]);
      ctx.restore();
    }

    edge(ctx, s, [near[0], 0, near[1]], [right[0], 0, right[1]]);
    edge(ctx, s, [near[0], 0, near[1]], [left[0], 0, left[1]]);
    if (!dash){
      edge(ctx, s, [right[0], 0, right[1]], [far[0], 0, far[1]]);
      edge(ctx, s, [left[0], 0, left[1]], [far[0], 0, far[1]]);
      edge(ctx, s, [far[0], 0, far[1]], [far[0], H, far[1]]);
    }
    if (H > 0){
      edge(ctx, s, [near[0], 0, near[1]], [near[0], H, near[1]]);
      edge(ctx, s, [right[0], 0, right[1]], [right[0], H, right[1]]);
      edge(ctx, s, [left[0], 0, left[1]], [left[0], H, left[1]]);
      for (i = 0; i < 4; i++)
        edge(ctx, s, [ring[i][0], H, ring[i][1]], [ring[(i+1)%4][0], H, ring[(i+1)%4][1]]);
    }
  }

  function furnitureReadout(s){
    return "1 ground unit &rarr; <b>" + s.m.across.toFixed(1) + "</b> px across, <b>" +
           s.m.rise.toFixed(1) + "</b> px rise<br>1 height unit &rarr; <b>" +
           s.m.up.toFixed(1) + "</b> px up";
  }

  function furnitureName(s){
    return "frame_" + s.L + "x" + s.W + "x" + s.H + "_" + s.cw + "x" + s.ch + ".png";
  }

  /* ================= character ================= */

  var inCH = $("in-ch"), inCR = $("in-cr"), inHeads = $("in-heads");
  var inCell = $("in-cell"), inCols = $("in-cols"), inRows = $("in-rows");
  var inLabels = $("in-labels");
  var inWalk = $("in-walk"), inRun = $("in-run"), inStep = $("in-step");
  var inMargin = $("in-margin"), inPose = $("in-pose");

  // Gait model. At an everyday 1.4 m/s an adult's step is about 0.415 x height;
  // faster gaits lengthen the step with the square root of speed, so a 6 m/s
  // sprint lands near 0.86 x height. Rule of thumb, tuned for looks, not biomechanics.
  var STANDARD_WALK_SPEED = 1.4;
  var STEP_PER_HEIGHT = 0.415;
  var STEPS_PER_LOOP = 2;
  // Below this a clip reads as a slideshow, above it the legs blur into a scramble.
  var SMOOTH_FPS_MIN = 6, SMOOTH_FPS_MAX = 15;

  // A row label decides which way the drawing looks. Unflipped art faces
  // screen-left, because PlayerVisual sets flipX when moving camera-right.
  function facingFor(label){
    var t = (label || "").toLowerCase();
    return { away: t.indexOf("back") >= 0, right: t.indexOf("right") >= 0 };
  }

  function characterSpec(){
    var m = metrics();
    var H = num(inCH, 1.7, 0.1);
    var r = num(inCR, 0.5, 0);
    var heads = num(inHeads, 0, 0);
    var cell = Math.round(num(inCell, 256, 8));
    var cols = Math.round(num(inCols, 8, 1));
    var rows = Math.round(num(inRows, 4, 1));
    var stepOverride = num(inStep, 0, 0);
    var labels = inLabels.value.split(",").map(function(t){ return t.trim(); });

    // Every clip must cover exactly STEPS_PER_LOOP steps per loop, or the feet slide.
    var gaits = {};
    [["walk", num(inWalk, STANDARD_WALK_SPEED, 0.3)], ["run", num(inRun, 3.5, 0.5)]].forEach(function(pair){
      var speed = pair[1];
      var step = stepOverride > 0 && pair[0] === "walk"
        ? stepOverride
        : STEP_PER_HEIGHT * H * Math.sqrt(speed / STANDARD_WALK_SPEED);
      var loopSeconds = STEPS_PER_LOOP * step / speed;
      var exactFps = cols / loopSeconds;
      var samples = Math.max(1, Math.round(exactFps));
      gaits[pair[0]] = {
        name: pair[0], speed: speed, step: step,
        stepsPerMinute: 60 * speed / step,
        samples: samples,
        // The speed the rounded clip really animates at: what Unity divides by.
        baseSpeed: STEPS_PER_LOOP * step * samples / cols,
        isRun: pair[0] === "run",
        used: labels.some(function(l){ return gaitKeyFor(l) === pair[0]; })
      };
    });

    var margin = Math.min(Math.round(num(inMargin, 40, 0)), cell);
    // Near foot of a camera-facing walk: half a step ahead, plus the foot itself.
    var deepestGait = gaits.run.used ? gaits.run : gaits.walk;
    var nearFootDrop = Math.ceil((footReachFor(deepestGait, H) + 0.2 * H) * m.rise);

    return {
      m:m, H:H, heads:heads, cell:cell, cols:cols, rows:rows,
      labels: labels, gaits: gaits, margin: margin, nearFootDrop: nearFootDrop,
      showPose: inPose.checked,
      figure: H * m.up,                      // drawn height of the character, px
      // A ground circle of radius r projects to an axis-aligned ellipse.
      footX: Math.SQRT2 * r * m.across,
      footY: Math.SQRT2 * r * m.rise,
      cw: cell * cols,
      ch: cell * rows
    };
  }

  // How far a foot lands ahead of the hip. A walk lands half a step ahead; a run
  // covers the rest of its long step in the air, so the foot never lands that far out.
  function footReachFor(gait, H){
    return Math.min(gait.step / 2, 0.24 * H);
  }

  function gaitKeyFor(label){
    var t = (label || "").toLowerCase();
    if (t.indexOf("run") >= 0) return "run";
    if (t.indexOf("walk") >= 0) return "walk";
    return null;
  }

  function paintCharacter(ctx, s, color){
    var col, row, x0, y0, baseY, midX, capY, n, spacing;
    var label, face, dirX, dirY, len, ax, ay, bx, by;
    ctx.lineCap = "square";
    ctx.strokeStyle = color;
    ctx.lineWidth = 1;

    for (row = 0; row < s.rows; row++){
      label = s.labels[row] || "";
      face = facingFor(label);
      for (col = 0; col < s.cols; col++){
        x0 = col * s.cell;
        y0 = row * s.cell;
        baseY = y0 + s.cell - s.margin;   // the pivot: the feet stand here
        midX  = x0 + s.cell / 2;
        capY  = baseY - s.figure;

        // The stance ellipse straddles the ground line, so keep every cell's
        // guide inside its own cell instead of bleeding into the row below.
        ctx.save();
        ctx.beginPath();
        ctx.rect(x0, y0, s.cell, s.cell);
        ctx.clip();

        // cell boundary
        ctx.save();
        ctx.globalAlpha = 0.32;
        ctx.setLineDash([3, 5]);
        ctx.strokeRect(x0 + 0.5, y0 + 0.5, s.cell - 1, s.cell - 1);
        ctx.restore();

        // centre line
        ctx.save();
        ctx.globalAlpha = 0.3;
        line(ctx, midX, y0, midX, baseY);
        ctx.restore();

        // head divisions, counted down from the crown so the part-head lands at the feet
        if (s.heads >= 1 && s.figure > 0){
          spacing = s.figure / s.heads;
          ctx.save();
          ctx.globalAlpha = 0.36;
          for (n = 1; n < s.heads; n++){
            line(ctx, x0 + s.cell * 0.18, capY + n * spacing, x0 + s.cell * 0.82, capY + n * spacing);
          }
          ctx.restore();
        }

        // stance ellipse: the capsule's footprint on the floor
        if (s.footX > 0 && s.footY > 0){
          ctx.save();
          ctx.globalAlpha = 0.55;
          ctx.setLineDash([4, 4]);
          ctx.beginPath();
          ctx.ellipse(midX, baseY, s.footX, s.footY, 0, 0, Math.PI * 2);
          ctx.stroke();
          ctx.restore();
        }

        // crown line and ground line: the two measurements that matter
        if (capY > y0) line(ctx, x0, capY, x0 + s.cell, capY);
        line(ctx, x0, baseY - 0.5, x0 + s.cell, baseY - 0.5);

        // caption, so the sheet still explains itself once it is in the art tool
        if (s.cell >= 96){
          ctx.save();
          ctx.globalAlpha = 0.6;
          ctx.fillStyle = color;
          ctx.font = "11px ui-monospace, Menlo, Consolas, monospace";
          ctx.textBaseline = "top";
          ctx.fillText(s.H.toFixed(2) + " m", x0 + 7, y0 + 6);
          if (label){
            ctx.textAlign = "right";
            ctx.fillText(label, x0 + s.cell - 7, y0 + 6);
            ctx.textAlign = "left";
          }
          ctx.restore();
        }

        // Facing arrow: a walk direction laid on the floor, so it carries the
        // camera's 2:1 ground angle rather than a flat screen diagonal.
        if (s.cell >= 96){
          dirX = (face.right ? 1 : -1) * s.m.across;
          dirY = (face.away ? -1 : 1) * s.m.rise;
          len = Math.sqrt(dirX * dirX + dirY * dirY) || 1;
          dirX /= len; dirY /= len;
          len = s.cell * 0.22;
          ax = midX;
          ay = baseY - (s.footY > 0 ? s.footY : s.cell * 0.12);
          bx = ax + dirX * len;
          by = ay + dirY * len;
          ctx.save();
          ctx.globalAlpha = 0.75;
          line(ctx, ax, ay, bx, by);
          // head
          line(ctx, bx, by, bx - (dirX * 0.94 - dirY * 0.34) * len * 0.3,
                            by - (dirY * 0.94 + dirX * 0.34) * len * 0.3);
          line(ctx, bx, by, bx - (dirX * 0.94 + dirY * 0.34) * len * 0.3,
                            by - (dirY * 0.94 - dirX * 0.34) * len * 0.3);
          ctx.restore();
        }

        if (s.showPose){
          var gaitKey = gaitKeyFor(label);
          paintMannequin(ctx, s, {
            hipX: midX, groundY: baseY, face: face,
            gait: gaitKey ? s.gaits[gaitKey] : null,
            phase: col / s.cols
          }, color);
        }

        ctx.restore();   // cell clip
      }
    }
  }

  // A ghost figure to trace over: one pose per frame, with the feet placed exactly
  // where the step length puts them on the projected floor. Column 0 is the
  // near leg's contact, then passing, then the far leg's contact, then passing.
  // Joints are solved in metres and projected afterwards: solving them in screen
  // pixels lets the squashed floor fold the knees of a figure walking away.
  function paintMannequin(ctx, s, pose, color){
    var H = s.H, m = s.m;
    var fx = pose.face.right ? 1 : -1, fy = pose.face.away ? -1 : 1;

    // Pixels per metre along the walk direction, and across it toward the camera.
    var forwardX = fx * m.across, forwardY = fy * m.rise;
    var sideX = fy * m.across, sideY = -fx * m.rise;
    if (sideY < 0){ sideX = -sideX; sideY = -sideY; }

    var gait = pose.gait;
    var isRun = !!(gait && gait.isRun);
    var angle = 2 * Math.PI * pose.phase;
    var halfStride = gait ? footReachFor(gait, H) : 0;
    var lift = gait ? (isRun ? 0.16 : 0.06) * H : 0;
    var ankleHeight = 0.04 * H, footLength = 0.13 * H;
    var legBone = 0.255 * H, armBone = 0.18 * H;
    var hipHalfWidth = 0.05 * H, shoulderHalfWidth = 0.11 * H;

    // Planted legs sweep back, the swinging leg comes forward lifted.
    var legs = [
      { side: 1,  offset:  Math.cos(angle) * halfStride, lift: Math.max(0, -Math.sin(angle)) * lift },
      { side: -1, offset: -Math.cos(angle) * halfStride, lift: Math.max(0,  Math.sin(angle)) * lift }
    ];

    // The hip sinks so a nearly straight planted leg still reaches its foot: the
    // natural bob. A standing knee keeps a little slack, holding the bob to ~4 cm.
    var hipHeight = 0.49 * H;
    legs.forEach(function(leg){
      if (leg.lift > 0.005 * H) return;
      hipHeight = Math.min(hipHeight, Math.sqrt(4 * legBone * legBone - leg.offset * leg.offset));
    });
    var pelvisHeight = hipHeight + ankleHeight;
    var shoulderHeight = pelvisHeight + 0.29 * H;
    var neckHeight = pelvisHeight + 0.33 * H;
    var headRadius = 0.065 * H;

    function toScreen(forward, side, height){
      return {
        x: pose.hipX + forward * forwardX + side * sideX,
        y: pose.groundY + forward * forwardY + side * sideY - height * m.up
      };
    }

    // Two equal bones from root to end, the middle joint bent forward (knee) or back (elbow).
    function limb(alpha, side, bone, rootForward, rootHeight, endForward, endHeight, bendsForward){
      var df = endForward - rootForward, dh = endHeight - rootHeight;
      var length = Math.sqrt(df * df + dh * dh) || 1e-6;
      var bend = Math.sqrt(Math.max(0, bone * bone - length * length / 4));
      var perpForward = -dh / length, perpHeight = df / length;
      if ((perpForward > 0) !== bendsForward){ perpForward = -perpForward; perpHeight = -perpHeight; }
      var root = toScreen(rootForward, side, rootHeight);
      var joint = toScreen((rootForward + endForward) / 2 + perpForward * bend, side,
                           (rootHeight + endHeight) / 2 + perpHeight * bend);
      var end = toScreen(endForward, side, endHeight);
      ctx.globalAlpha = alpha;
      ctx.beginPath(); ctx.moveTo(root.x, root.y); ctx.lineTo(joint.x, joint.y); ctx.lineTo(end.x, end.y); ctx.stroke();
    }

    function drawSide(sign){
      var leg = sign > 0 ? legs[0] : legs[1];
      var alpha = sign > 0 ? 0.65 : 0.3;
      var hipSide = sign * hipHalfWidth, shoulderSide = sign * shoulderHalfWidth;

      limb(alpha, hipSide, legBone, 0, pelvisHeight, leg.offset, ankleHeight + leg.lift, true);
      var heel = toScreen(leg.offset, hipSide, leg.lift);
      var toe = toScreen(leg.offset + footLength, hipSide, leg.lift);
      line(ctx, heel.x, heel.y, toe.x, toe.y);

      // Arms swing against the leg on the same side; a run bends them up at the elbow.
      var handForward = -leg.offset * (isRun ? 0.9 : 0.5);
      var handHeight = shoulderHeight - (isRun ? 0.22 : 0.34) * H;
      limb(alpha, shoulderSide, armBone, 0, shoulderHeight, handForward, handHeight, false);
    }

    ctx.save();
    ctx.lineWidth = 1.5;
    ctx.lineCap = "round";
    ctx.strokeStyle = color;

    drawSide(-1);

    ctx.globalAlpha = 0.65;
    var pelvis = toScreen(0, 0, pelvisHeight), neck = toScreen(0, 0, neckHeight);
    line(ctx, pelvis.x, pelvis.y, neck.x, neck.y);
    var hipFar = toScreen(0, -hipHalfWidth, pelvisHeight), hipNear = toScreen(0, hipHalfWidth, pelvisHeight);
    line(ctx, hipFar.x, hipFar.y, hipNear.x, hipNear.y);
    var shoulderFar = toScreen(0, -shoulderHalfWidth, shoulderHeight);
    var shoulderNear = toScreen(0, shoulderHalfWidth, shoulderHeight);
    line(ctx, shoulderFar.x, shoulderFar.y, shoulderNear.x, shoulderNear.y);

    var head = toScreen(0, 0, neckHeight + headRadius * 1.1);
    ctx.beginPath();
    ctx.arc(head.x, head.y, headRadius * m.up, 0, Math.PI * 2);
    ctx.stroke();
    // Nose tick, so the figure shows where it looks.
    var noseRoot = toScreen(headRadius * 0.8, 0, neckHeight + headRadius);
    var noseTip = toScreen(headRadius * 1.6, 0, neckHeight + headRadius * 0.9);
    line(ctx, noseRoot.x, noseRoot.y, noseTip.x, noseTip.y);

    drawSide(1);
    ctx.restore();
  }

  function characterReadout(s){
    var over = s.figure + s.margin > s.cell;
    var text = "draw the figure <b>" + Math.round(s.figure) + "</b> px tall<br>" +
           "sheet of <b>" + s.cols + " &times; " + s.rows + "</b> cells at <b>" + s.cell + "</b> px<br>" +
           (over ? "<em>the cell is too short &mdash; raise the cell size</em><br>" : "") +
           "feet fit inside <b>" + Math.round(s.footX * 2) + " &times; " +
           Math.round(s.footY * 2) + "</b> px<br>1 metre &rarr; <b>" +
           s.m.up.toFixed(1) + "</b> px";

    ["walk", "run"].forEach(function(key){
      var g = s.gaits[key];
      if (key === "run" && !g.used) return;
      var fps = s.cols * g.speed / (STEPS_PER_LOOP * g.step);
      text += "<br><br><b>" + key + "</b> " + g.speed.toFixed(1) + " m/s &middot; step <b>" +
              g.step.toFixed(2) + "</b> m &middot; " + Math.round(g.stepsPerMinute) + " steps/min<br>" +
              "one step moves the body <b>" + Math.round(g.step * s.m.across) + "</b> &times; <b>" +
              Math.round(g.step * s.m.rise) + "</b> px<br>" +
              "Unity &rarr; Samples <b>" + g.samples + "</b> &middot; base speed <b>" +
              g.baseSpeed.toFixed(2) + "</b> m/s";
      if (fps < SMOOTH_FPS_MIN)
        text += "<br><em>" + g.samples + " fps looks choppy &mdash; draw " +
                Math.ceil(s.cols * SMOOTH_FPS_MIN / fps) + "+ frames</em>";
      if (fps > SMOOTH_FPS_MAX)
        text += "<br><em>" + g.samples + " fps looks frantic &mdash; fewer frames or a run row</em>";
      if (!g.used) text += "<br><em>no row is labelled &ldquo;" + key + "&rdquo;</em>";
    });

    text += "<br><br>Unity pivot &rarr; Custom X <b>0.5</b> Y <b>" +
            parseFloat((s.margin / s.cell).toFixed(4)) + "</b>";
    if (s.nearFootDrop > s.margin)
      text += "<br><em>the near foot reaches " + s.nearFootDrop + " px below the pivot &mdash; raise the floor margin</em>";
    return text;
  }

  function characterName(s){
    return "char_" + s.H + "m_walk" + s.gaits.walk.speed + "_cell" + s.cell + "_" + s.cols + "x" + s.rows + ".png";
  }

  /* ================= shared ================= */

  var MODES = {
    furniture: { spec: furnitureSpec, paint: paintFurniture,
                 readout: furnitureReadout, name: furnitureName, extra: null },
    character: { spec: characterSpec, paint: paintCharacter,
                 readout: characterReadout, name: characterName,
                 extra: function(s){
                   return { k: "Figure", v: Math.round(s.figure) + " <small>px</small>" };
                 } }
  };

  function render(){
    var mode = MODES[tab];
    var s = mode.spec();
    var color = ink === "dark" ? INK_DARK : INK_LIGHT;
    stage.className = "stage " + (ink === "dark" ? "on-paper" : "on-ink");

    // Fit the preview into the sheet without ever upscaling past 1:1.
    var box = stage.parentNode.getBoundingClientRect();
    var avail = { w: Math.max(120, box.width - 80), h: Math.max(120, box.height - 150) };
    var scale = Math.min(1, avail.w / s.cw, avail.h / s.ch);
    var dpr = window.devicePixelRatio || 1;

    preview.width  = Math.max(1, Math.round(s.cw * scale * dpr));
    preview.height = Math.max(1, Math.round(s.ch * scale * dpr));
    preview.style.width  = (s.cw * scale) + "px";
    preview.style.height = (s.ch * scale) + "px";

    var ctx = preview.getContext("2d");
    ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
    mode.paint(ctx, s, color);

    outSize.innerHTML = s.cw + " &times; " + s.ch + " <small>px</small>";
    var extra = mode.extra && mode.extra(s);
    tbExtra.hidden = !extra;
    if (extra){ outExtraK.textContent = extra.k; outExtra.innerHTML = extra.v; }
    $("tb-clip").hidden = tab !== "character";
    if (tab === "character")
      $("out-clip").innerHTML = s.gaits.walk.samples + " <small>fps &middot; " +
                                s.gaits.walk.baseSpeed.toFixed(2) + " m/s</small>";

    derived.innerHTML = mode.readout(s) + "<br>preview at <b>" + Math.round(scale * 100) + "%</b>";
    copyhint.textContent = "click size to copy";
  }

  function exportPNG(){
    var mode = MODES[tab];
    var s = mode.spec();
    var c = document.createElement("canvas");
    c.width = s.cw; c.height = s.ch;
    mode.paint(c.getContext("2d"), s, ink === "dark" ? INK_DARK : INK_LIGHT);
    var a = document.createElement("a");
    a.download = mode.name(s);
    a.href = c.toDataURL("image/png");
    a.click();
  }

  function setTab(next){
    tab = next;
    ["furniture", "character"].forEach(function(t){
      $("tab-" + t).setAttribute("aria-selected", String(t === next));
      $("spec-" + t).hidden = (t !== next);
    });
    render();
  }

  /* ================= number fields =================
     Each one is a scrub field: drag it sideways to change the value, keep
     dragging away from the row for finer steps, tap to type, hold the -/+
     keys to repeat with acceleration, or roll the wheel over a focused field. */

  var syncers = [];
  function syncSteppers(){ for (var i = 0; i < syncers.length; i++) syncers[i](); }

  function buzz(ms){
    if (navigator.vibrate) { try { navigator.vibrate(ms); } catch (e) {} }
  }
  function stepOf(el){
    var st = parseFloat(el.step);
    return isFinite(st) && st > 0 ? st : 1;
  }
  function decimalsOf(step){
    var s = String(step), dot = s.indexOf(".");
    return dot < 0 ? 0 : s.length - 1 - dot;
  }
  function clampTo(el, v){
    var mn = parseFloat(el.min), mx = parseFloat(el.max);
    if (isFinite(mn) && v < mn) v = mn;
    if (isFinite(mx) && v > mx) v = mx;
    return v;
  }
  function readVal(el){
    var v = parseFloat(el.value);
    return isFinite(v) ? v : (parseFloat(el.defaultValue) || 0);
  }
  // Returns true when the value actually moved, so callers can buzz / stop repeating.
  function writeVal(el, v){
    var next = String(parseFloat(clampTo(el, v).toFixed(decimalsOf(stepOf(el)))));
    if (next === el.value) return false;
    el.value = next;
    syncSteppers();
    render();
    return true;
  }
  function nudge(el, mult){ return writeVal(el, readVal(el) + mult * stepOf(el)); }

  function stepButton(el, dir, name){
    var b = document.createElement("button");
    b.type = "button";
    b.textContent = dir < 0 ? "−" : "+";
    b.setAttribute("aria-label", (dir < 0 ? "Decrease " : "Increase ") + name);

    var hold = null, repeat = null, ticks = 0;
    function stop(){
      clearTimeout(hold); clearInterval(repeat);
      hold = repeat = null; ticks = 0;
      b.classList.remove("held");
    }
    function tick(){
      ticks++;
      var mult = ticks > 26 ? 5 : ticks > 10 ? 2 : 1;   // accelerate on a long hold
      if (nudge(el, dir * mult)) buzz(4); else stop();
    }
    b.addEventListener("pointerdown", function(e){
      if (e.button) return;
      e.preventDefault();                                // no focus ring hijack, no double-tap zoom
      b.classList.add("held");
      if (nudge(el, dir)) buzz(8);
      hold = setTimeout(function(){ repeat = setInterval(tick, 70); }, 380);
    });
    ["pointerup", "pointercancel", "pointerleave"].forEach(function(t){
      b.addEventListener(t, stop);
    });
    b.addEventListener("keydown", function(e){
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); if (nudge(el, dir)) buzz(8); }
    });
    return b;
  }

  var DEAD_ZONE = 6;      // px of travel before a tap becomes a drag
  var COARSE_PX = 16;     // px of drag per step at the row's own height
  var FINE_SPAN = 150;    // px away from the row that buys the finest steps

  function makeScrub(el, bubble, field){
    var origin = null, moved = false, startVal = 0, pid = null;

    el.addEventListener("pointerdown", function(e){
      if (e.button) return;
      e.preventDefault();                                // suppress the caret until we know it's a tap
      origin = { x: e.clientX, y: e.clientY };
      startVal = readVal(el);
      moved = false;
      pid = e.pointerId;
    });

    el.addEventListener("pointermove", function(e){
      if (!origin || e.pointerId !== pid) return;
      var dx = e.clientX - origin.x, dy = Math.abs(e.clientY - origin.y);
      if (!moved){
        if (Math.abs(dx) < DEAD_ZONE) return;
        moved = true;
        try { el.setPointerCapture(pid); } catch (err) {}
        el.blur();
        el.classList.add("scrub"); field.classList.add("scrub");
      }
      var perStep = COARSE_PX + Math.min(dy, FINE_SPAN) * 1.2;
      if (writeVal(el, startVal + Math.round(dx / perStep) * stepOf(el))) buzz(3);
      bubble.innerHTML = "<b>" + el.value + "</b>" +
        (dy > 40 ? " <i>FINE</i>" : " <i>&plusmn;" + stepOf(el) + "</i>");
      bubble.classList.add("on");
    });

    function end(){
      if (!origin) return;
      origin = null;
      if (moved){
        try { el.releasePointerCapture(pid); } catch (err) {}
        el.classList.remove("scrub"); field.classList.remove("scrub");
        bubble.classList.remove("on");
      } else {
        el.focus();
        el.select();                                     // a tap hands the whole value to the keypad
      }
      pid = null;
    }
    ["pointerup", "pointercancel"].forEach(function(t){ el.addEventListener(t, end); });

    el.addEventListener("wheel", function(e){
      if (document.activeElement !== el) return;
      e.preventDefault();
      nudge(el, e.deltaY < 0 ? 1 : -1);
    }, { passive: false });
  }

  Array.prototype.forEach.call(document.querySelectorAll(".stepper"), function(stepper){
    var el = stepper.querySelector("input[type=number]");
    if (!el) return;
    var row = el.closest(".dim");
    var nameEl = row && row.querySelector(".name");
    var name = nameEl ? nameEl.textContent.toLowerCase() : "value";

    var field = document.createElement("div");
    field.className = "field";
    var bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.setAttribute("aria-hidden", "true");
    stepper.insertBefore(field, el);
    field.appendChild(el);
    field.appendChild(bubble);

    var minus = stepButton(el, -1, name), plus = stepButton(el, 1, name);
    stepper.insertBefore(minus, field);
    stepper.appendChild(plus);

    syncers.push(function(){
      var mn = parseFloat(el.min), mx = parseFloat(el.max), v = readVal(el);
      minus.disabled = isFinite(mn) && v <= mn;
      plus.disabled  = isFinite(mx) && v >= mx;
    });
  });

  /* ---- wiring ---- */
  Array.prototype.forEach.call(document.querySelectorAll("input[type=number]"), function(el){
    el.addEventListener("input", function(){ syncSteppers(); render(); });
    el.addEventListener("blur", function(){
      if (el.value.trim() === "") { el.value = el.defaultValue; syncSteppers(); render(); }
    });
  });
  [inGrid, inHidden, inPose].forEach(function(el){ el.addEventListener("change", render); });
  inLabels.addEventListener("input", render);
  syncSteppers();

  Array.prototype.forEach.call(document.querySelectorAll("#ink-seg button"), function(b){
    b.addEventListener("click", function(){
      ink = b.dataset.ink;
      Array.prototype.forEach.call(document.querySelectorAll("#ink-seg button"), function(o){
        o.setAttribute("aria-pressed", String(o === b));
      });
      render();
    });
  });

  $("tab-furniture").addEventListener("click", function(){ setTab("furniture"); });
  $("tab-character").addEventListener("click", function(){ setTab("character"); });
  $("download").addEventListener("click", exportPNG);

  outSize.style.cursor = "pointer";
  outSize.addEventListener("click", function(){
    var s = MODES[tab].spec();
    navigator.clipboard.writeText(s.cw + " x " + s.ch).then(function(){
      copyhint.textContent = "copied";
    }, function(){
      copyhint.textContent = "copy blocked by browser";
    });
  });

  window.addEventListener("resize", render);
  setTab("furniture");
})();
</script>
